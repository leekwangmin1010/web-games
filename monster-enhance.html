<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>몬스터 강화하기</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0a1a2e 100%);
            min-height: 100vh;
            font-family: 'Noto Sans KR', sans-serif;
            color: #e0e0e0;
            overflow-x: hidden;
        }

        .game-container { max-width: 1200px; margin: 0 auto; padding: 20px; }

        header { text-align: center; padding: 20px 0; border-bottom: 2px solid #2a2a4a; margin-bottom: 20px; }

        header h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #ffd700, #ff6b6b, #ffd700);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite;
        }

        @keyframes shine { to { background-position: 200% center; } }

        .stats-bar { display: flex; justify-content: center; gap: 30px; margin-top: 10px; flex-wrap: wrap; }

        .stat-item {
            display: flex; align-items: center; gap: 8px;
            background: rgba(255,255,255,0.05); padding: 8px 16px;
            border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);
        }

        .stat-item .icon { font-size: 1.3rem; }
        .stat-item .value { font-weight: bold; color: #ffd700; }

        .main-content { display: grid; grid-template-columns: 1fr 350px; gap: 20px; }
        @media (max-width: 900px) { .main-content { grid-template-columns: 1fr; } }

        .enhance-section {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px; padding: 25px; text-align: center;
        }

        .monster-display {
            position: relative; width: 200px; height: 200px; margin: 0 auto 20px;
            display: flex; align-items: center; justify-content: center;
        }

        .monster-sprite { font-size: 6rem; transition: all 0.3s; filter: drop-shadow(0 0 20px rgba(255,215,0,0.5)); }
        .monster-sprite.enhancing { animation: enhance-shake 0.1s infinite; }
        @keyframes enhance-shake {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(-3px, 2px) rotate(-2deg); }
            50% { transform: translate(3px, -2px) rotate(2deg); }
            75% { transform: translate(-2px, -3px) rotate(-1deg); }
        }
        .monster-sprite.success { animation: success-bounce 0.6s ease-out; }
        @keyframes success-bounce {
            0% { transform: scale(1); } 30% { transform: scale(1.4); }
            60% { transform: scale(0.9); } 100% { transform: scale(1); }
        }
        .monster-sprite.fail { animation: fail-shake 0.5s ease-out; }
        @keyframes fail-shake {
            0%, 100% { transform: translateX(0); filter: grayscale(0); }
            20% { transform: translateX(-15px); filter: grayscale(1); }
            40% { transform: translateX(15px); }
            60% { transform: translateX(-10px); }
            80% { transform: translateX(10px); }
        }

        .enhance-level { font-size: 3rem; font-weight: 900; margin: 10px 0; }
        .enhance-level .plus { color: #ffd700; }
        .enhance-level .number {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .monster-name { font-size: 1.5rem; font-weight: 700; margin-bottom: 5px; }

        .monster-tier { display: inline-block; padding: 4px 12px; border-radius: 12px; font-size: 0.8rem; font-weight: 700; margin-bottom: 15px; }
        .tier-common { background: #4a4a6a; color: #aaa; }
        .tier-uncommon { background: #2d5a27; color: #7fff7f; }
        .tier-rare { background: #1a3a5c; color: #5cb3ff; }
        .tier-epic { background: #3d1a5c; color: #b35cff; }
        .tier-legendary { background: #5c3a1a; color: #ffb35c; }
        .tier-mythic { background: #5c1a1a; color: #ff5c5c; }
        .tier-divine { background: linear-gradient(135deg, #ffd700, #ff6b6b); color: #000; }

        .success-rate { margin: 15px 0; padding: 12px; background: rgba(0,0,0,0.3); border-radius: 10px; }
        .rate-bar { height: 20px; background: #1a1a2e; border-radius: 10px; overflow: hidden; margin-top: 8px; position: relative; }
        .rate-fill { height: 100%; border-radius: 10px; transition: width 0.5s; }
        .rate-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 0.75rem; font-weight: bold; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }

        .enhance-btn {
            width: 100%; padding: 18px; font-size: 1.3rem; font-weight: 900;
            border: none; border-radius: 12px; cursor: pointer; margin-top: 15px;
            transition: all 0.2s; text-transform: uppercase; letter-spacing: 2px;
        }
        .enhance-btn.primary { background: linear-gradient(135deg, #ffd700, #ff8c00); color: #000; box-shadow: 0 4px 20px rgba(255, 215, 0, 0.4); }
        .enhance-btn.primary:hover { transform: translateY(-2px); box-shadow: 0 6px 30px rgba(255, 215, 0, 0.6); }
        .enhance-btn.danger { background: linear-gradient(135deg, #ff4444, #cc0000); color: #fff; }
        .enhance-btn:disabled { background: #333; color: #666; cursor: not-allowed; box-shadow: none; }

        .cost-display { display: flex; justify-content: center; gap: 20px; margin-top: 10px; font-size: 0.9rem; color: #888; }
        .cost-display span { display: flex; align-items: center; gap: 5px; }

        .battle-section { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 20px; margin-top: 20px; }
        .battle-section h3 { margin-bottom: 15px; color: #ffd700; }

        .battle-arena {
            background: rgba(0,0,0,0.3); border-radius: 12px; padding: 20px; min-height: 150px;
            display: flex; align-items: center; justify-content: center; gap: 30px; position: relative; overflow: hidden;
        }
        .battle-arena::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(ellipse at center, rgba(255,100,0,0.1) 0%, transparent 70%); pointer-events: none;
        }

        .fighter { text-align: center; z-index: 1; }
        .fighter .sprite { font-size: 3.5rem; transition: all 0.2s; }
        .fighter .sprite.attacking { animation: attack-lunge 0.3s; }
        @keyframes attack-lunge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(20px) scale(1.2); } }
        .fighter .sprite.hit { animation: hit-recoil 0.3s; }
        @keyframes hit-recoil { 0%, 100% { transform: translateX(0); filter: brightness(1); } 50% { transform: translateX(-15px); filter: brightness(3) hue-rotate(-30deg); } }
        .fighter .name { font-size: 0.85rem; margin-top: 5px; color: #aaa; }
        .fighter .hp-bar { width: 100px; height: 8px; background: #333; border-radius: 4px; margin: 5px auto 0; overflow: hidden; }
        .fighter .hp-fill { height: 100%; background: linear-gradient(90deg, #e74c3c, #c0392b); border-radius: 4px; transition: width 0.3s; }

        .vs-text { font-size: 2rem; font-weight: 900; color: #ff4444; text-shadow: 0 0 20px rgba(255, 68, 68, 0.5); }

        .battle-log { margin-top: 15px; max-height: 120px; overflow-y: auto; font-size: 0.8rem; line-height: 1.6; }
        .battle-log::-webkit-scrollbar { width: 4px; }
        .battle-log::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
        .battle-msg { padding: 2px 0; }
        .battle-msg.damage { color: #ff6b6b; }
        .battle-msg.heal { color: #7fff7f; }
        .battle-msg.gold { color: #ffd700; }
        .battle-msg.critical { color: #ff4444; font-weight: bold; }
        .battle-msg.reward { color: #b35cff; font-weight: bold; }

        .sidebar { display: flex; flex-direction: column; gap: 15px; }

        .collection-panel { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 20px; }
        .collection-panel h3 { margin-bottom: 15px; color: #ffd700; display: flex; justify-content: space-between; align-items: center; }
        .collection-count { font-size: 0.85rem; color: #888; }

        .monster-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; max-height: 400px; overflow-y: auto; padding-right: 5px; }
        .monster-grid::-webkit-scrollbar { width: 4px; }
        .monster-grid::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

        .monster-card {
            aspect-ratio: 1; background: rgba(0,0,0,0.3); border: 2px solid #2a2a4a;
            border-radius: 10px; display: flex; flex-direction: column; align-items: center;
            justify-content: center; cursor: pointer; transition: all 0.2s; position: relative;
        }
        .monster-card:hover { border-color: #ffd700; transform: scale(1.05); }
        .monster-card.selected { border-color: #ffd700; box-shadow: 0 0 15px rgba(255, 215, 0, 0.3); }
        .monster-card.locked { opacity: 0.3; filter: grayscale(1); }
        .monster-card .card-sprite { font-size: 1.8rem; }
        .monster-card .card-level { position: absolute; top: 2px; right: 4px; font-size: 0.6rem; color: #ffd700; font-weight: bold; }
        .monster-card .card-tier { position: absolute; bottom: 2px; left: 0; right: 0; height: 3px; border-radius: 0 0 8px 8px; }

        .sparkle { position: absolute; pointer-events: none; animation: sparkle-fly 1s ease-out forwards; }
        @keyframes sparkle-fly { 0% { opacity: 1; transform: translate(0, 0) scale(1); } 100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0); } }

        .enhance-result {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 4rem; font-weight: 900; z-index: 1000; pointer-events: none;
            animation: result-pop 1.5s ease-out forwards; text-shadow: 0 0 30px currentColor;
        }
        @keyframes result-pop {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            20% { opacity: 1; transform: translate(-50%, -50%) scale(1.3); }
            80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1.5); }
        }
        .enhance-result.success { color: #ffd700; }
        .enhance-result.fail { color: #ff4444; }
        .enhance-result.critical { color: #ff6b00; font-size: 5rem; }

        .tab-buttons { display: flex; gap: 5px; margin-bottom: 15px; }
        .tab-btn {
            flex: 1; padding: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: #888; border-radius: 8px; cursor: pointer; font-size: 0.85rem; transition: all 0.2s;
        }
        .tab-btn:hover { background: rgba(255,255,255,0.1); }
        .tab-btn.active { background: rgba(255, 215, 0, 0.2); border-color: #ffd700; color: #ffd700; }

        .gacha-section { text-align: center; }
        .gacha-btn {
            padding: 15px 40px; font-size: 1.1rem; font-weight: 700;
            background: linear-gradient(135deg, #9b59b6, #8e44ad); border: none;
            color: #fff; border-radius: 12px; cursor: pointer; transition: all 0.2s; margin: 10px 0;
        }
        .gacha-btn:hover { transform: scale(1.05); box-shadow: 0 5px 20px rgba(155, 89, 182, 0.4); }

        .gacha-result { margin-top: 15px; padding: 15px; background: rgba(0,0,0,0.3); border-radius: 10px; display: none; }
        .gacha-result.show { display: block; animation: gacha-reveal 0.5s ease-out; }
        @keyframes gacha-reveal { 0% { opacity: 0; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1); } }
        .gacha-monster { font-size: 4rem; margin: 10px 0; }

        .auto-battle { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 15px; }
        .toggle-switch { position: relative; width: 50px; height: 26px; background: #333; border-radius: 13px; cursor: pointer; transition: background 0.3s; }
        .toggle-switch.active { background: #27ae60; }
        .toggle-switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; background: #fff; border-radius: 50%; transition: transform 0.3s; }
        .toggle-switch.active::after { transform: translateX(24px); }

        .save-indicator {
            position: fixed; bottom: 20px; right: 20px; background: rgba(0,0,0,0.8);
            padding: 8px 16px; border-radius: 20px; font-size: 0.75rem; color: #888;
            opacity: 0; transition: opacity 0.3s;
        }
        .save-indicator.show { opacity: 1; }

        .reward-popup {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.95); border: 2px solid #ffd700; border-radius: 16px;
            padding: 30px 40px; text-align: center; z-index: 1000; display: none;
            animation: reward-popup 0.5s ease-out;
        }
        .reward-popup.show { display: block; }
        @keyframes reward-popup { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); } 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
        .reward-popup .reward-sprite { font-size: 5rem; margin: 10px 0; }
        .reward-popup .reward-name { font-size: 1.5rem; font-weight: bold; color: #ffd700; }
        .reward-popup .reward-tier { font-size: 0.9rem; margin-top: 5px; }
        .reward-popup .reward-close { margin-top: 15px; padding: 10px 30px; background: #ffd700; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }

        .inventory-bar {
            display: flex; justify-content: center; gap: 15px; margin-top: 15px; flex-wrap: wrap;
        }
        .inv-item {
            display: flex; align-items: center; gap: 5px; background: rgba(255,255,255,0.05);
            padding: 6px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);
            font-size: 0.85rem;
        }
        .inv-item .inv-icon { font-size: 1.2rem; }
        .inv-item .inv-count { color: #ffd700; font-weight: bold; }

        .shield-toggle {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            margin-top: 15px; padding: 10px; background: rgba(255,255,255,0.03);
            border-radius: 10px; border: 1px solid rgba(255,255,255,0.1);
        }
        .shield-toggle .toggle-switch { width: 44px; height: 22px; }
        .shield-toggle .toggle-switch::after { width: 16px; height: 16px; }
        .shield-toggle .toggle-switch.active::after { transform: translateX(22px); }
        .shield-toggle .toggle-switch.active { background: #3498db; }
        .shield-label { font-size: 0.85rem; color: #888; }
        .shield-status { font-size: 0.8rem; color: #3498db; font-weight: bold; }

        .critical-indicator {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            margin-top: 10px; padding: 8px; background: rgba(255, 107, 0, 0.1);
            border-radius: 8px; border: 1px solid rgba(255, 107, 0, 0.3);
            font-size: 0.85rem; color: #ff6b00;
        }

        @media (max-width: 600px) {
            .monster-grid { grid-template-columns: repeat(4, 1fr); }
            .stats-bar { gap: 10px; }
            .stat-item { padding: 6px 10px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <header>
            <h1>⚔️ 몬스터 강화하기 ⚔️</h1>
            <div class="stats-bar">
                <div class="stat-item">
                    <span class="icon">💰</span>
                    <span class="value" id="goldDisplay">0</span>
                </div>
                <div class="stat-item">
                    <span class="icon">🛡️</span>
                    <span class="value" id="shieldCount">0</span>
                    <span style="color:#666; font-size:0.8rem;">방지권</span>
                </div>
                <div class="stat-item">
                    <span class="icon">🏆</span>
                    <span class="value" id="totalEnhanceDisplay">0</span>
                    <span style="color:#666; font-size:0.8rem;">강화</span>
                </div>
                <div class="stat-item">
                    <span class="icon">📊</span>
                    <span class="value" id="collectionCount">0/300</span>
                </div>
            </div>
        </header>

        <div class="main-content">
            <div class="left-panel">
                <div class="enhance-section">
                    <div class="monster-display">
                        <div class="monster-sprite" id="monsterSprite">🐀</div>
                    </div>
                    <div class="enhance-level">
                        <span class="plus">+</span><span class="number" id="enhanceLevel">0</span>
                    </div>
                    <div class="monster-name" id="monsterName">쥐</div>
                    <div class="monster-tier tier-common" id="monsterTier">커먼</div>

                    <div class="success-rate">
                        <div style="display:flex; justify-content:space-between; font-size:0.85rem;">
                            <span>성공 확률</span>
                            <span id="successRateText" style="color:#ffd700; font-weight:bold;">100%</span>
                        </div>
                        <div class="rate-bar">
                            <div class="rate-fill" id="successRateBar" style="width:100%; background: linear-gradient(90deg, #27ae60, #2ecc71);"></div>
                            <span class="rate-text" id="rateText">100%</span>
                        </div>
                    </div>

                    <div class="critical-indicator">
                        <span>💥 크리티컬 확률: <span id="criticalRateText" style="font-weight:bold;">10%</span> (2배 강화)</span>
                    </div>

                    <div class="cost-display">
                        <span>💰 <span id="enhanceCost">100</span> 골드</span>
                        <span>📈 공격력: <span id="atkValue">10</span></span>
                        <span>❤️ 체력: <span id="hpValue">50</span></span>
                    </div>

                    <div class="inventory-bar">
                        <div class="inv-item">
                            <span class="inv-icon">🛡️</span>
                            <span>깨짐방지권: <span class="inv-count" id="shieldInventory">0</span>개</span>
                        </div>
                    </div>

                    <div class="shield-toggle">
                        <span class="shield-label">🛡️ 깨짐방지권 사용</span>
                        <div class="toggle-switch" id="shieldToggle" onclick="toggleShield()"></div>
                        <span id="shieldStatus" class="shield-status">OFF</span>
                    </div>

                    <button class="enhance-btn primary" id="enhanceBtn" onclick="tryEnhance()">
                        ⚡ 강화하기 ⚡
                    </button>
                    <button class="enhance-btn danger" id="forceEnhanceBtn" onclick="forceEnhance()" style="margin-top:10px; font-size:0.9rem; padding:12px;">
                        💀 강제 강화 (파괴 위험)
                    </button>
                </div>

                <div class="battle-section">
                    <h3>⚔️ 자동 전투</h3>
                    <div class="battle-arena" id="battleArena">
                        <div class="fighter" id="playerFighter">
                            <div class="sprite" id="playerBattleSprite">🐀</div>
                            <div class="name" id="playerBattleName">쥐</div>
                            <div class="hp-bar"><div class="hp-fill" id="playerHpBar" style="width:100%"></div></div>
                        </div>
                        <div class="vs-text">VS</div>
                        <div class="fighter" id="enemyFighter">
                            <div class="sprite" id="enemyBattleSprite">👺</div>
                            <div class="name" id="enemyBattleName">고블린</div>
                            <div class="hp-bar"><div class="hp-fill" id="enemyHpBar" style="width:100%"></div></div>
                        </div>
                    </div>
                    <div class="battle-log" id="battleLog"></div>
                    <div class="auto-battle">
                        <span style="font-size:0.85rem; color:#888;">자동 전투</span>
                        <div class="toggle-switch" id="autoBattleToggle" onclick="toggleAutoBattle()"></div>
                        <span id="autoBattleStatus" style="font-size:0.8rem; color:#666;">OFF</span>
                    </div>
                </div>
            </div>

            <div class="sidebar">
                <div class="collection-panel gacha-section">
                    <h3>🎰 몬스터 뽑기</h3>
                    <div style="font-size:0.8rem; color:#888; margin-bottom:10px;">
                        골드로 새로운 몬스터를 획득하세요!
                    </div>
                    <button class="gacha-btn" onclick="pullGacha()">🎲 뽑기 (💰 500)</button>
                    <div class="gacha-result" id="gachaResult">
                        <div class="gacha-monster" id="gachaMonsterSprite"></div>
                        <div id="gachaMonsterName" style="font-weight:bold;"></div>
                        <div id="gachaMonsterTier" style="font-size:0.8rem; margin-top:5px;"></div>
                    </div>
                </div>

                <div class="collection-panel">
                    <h3>
                        📖 도감
                        <span class="collection-count" id="collectionText">0/300</span>
                    </h3>
                    <div class="tab-buttons">
                        <button class="tab-btn active" onclick="switchTab('all', this)">전체</button>
                        <button class="tab-btn" onclick="switchTab('owned', this)">보유</button>
                    </div>
                    <div class="monster-grid" id="monsterGrid"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="reward-popup" id="rewardPopup">
        <div style="font-size:1rem; color:#ffd700; font-weight:bold;">🎉 강화 보상!</div>
        <div class="reward-sprite" id="rewardSprite"></div>
        <div class="reward-name" id="rewardName"></div>
        <div class="reward-tier" id="rewardTier"></div>
        <button class="reward-close" onclick="closeRewardPopup()">확인</button>
    </div>

    <div class="save-indicator" id="saveIndicator">💾 저장됨</div>

    <script>
        // ==================== MONSTER DATABASE (300종) ====================
        const MONSTERS = [
            // Tier 1: 커먼 (1-60)
            { id: 1, name: '쥐', sprite: '🐀', tier: 'common', baseAtk: 5, baseHp: 30, gold: 50 },
            { id: 2, name: '박쥐', sprite: '🦇', tier: 'common', baseAtk: 6, baseHp: 25, gold: 60 },
            { id: 3, name: '슬라임', sprite: '🟢', tier: 'common', baseAtk: 4, baseHp: 40, gold: 50 },

            return rates[enhanceLevel] || 0;
        }

        function getCriticalRate(enhanceLevel) {
            // 기본 10%, 레벨이 오를수록 감소
            return Math.max(5, 15 - enhanceLevel * 0.5);
        }

        function getEnhanceCost(enhanceLevel) {
            return Math.floor(100 * Math.pow(1.5, enhanceLevel));
        }

        function getMonsterStats(monsterId, enhanceLevel) {
            const base = MONSTERS.find(m => m.id === monsterId);
            const multiplier = 1 + enhanceLevel * 0.15;
            return { atk: Math.floor(base.baseAtk * multiplier), hp: Math.floor(base.baseHp * multiplier), gold: Math.floor(base.gold * multiplier) };
        }

        function toggleShield() {
            gameState.shieldActive = !gameState.shieldActive;
            document.getElementById('shieldToggle').classList.toggle('active', gameState.shieldActive);
            document.getElementById('shieldStatus').textContent = gameState.shieldActive ? 'ON' : 'OFF';
            document.getElementById('shieldStatus').style.color = gameState.shieldActive ? '#3498db' : '#666';
        }

        function tryEnhance() {
            const monster = gameState.collection[gameState.selectedMonster];
            if (!monster) return;

            const cost = getEnhanceCost(monster.enhanceLevel);
            if (gameState.gold < cost) { addBattleMsg('골드가 부족합니다!', 'damage'); return; }

            gameState.gold -= cost;
            gameState.totalEnhances++;

            const rate = getSuccessRate(monster.enhanceLevel);
            const critRate = getCriticalRate(monster.enhanceLevel);
            const roll = Math.random() * 100;
            const critRoll = Math.random() * 100;
            const isCritical = critRoll < critRate;
            const success = roll < rate;
            const increase = isCritical ? 2 : 1;

            const sprite = document.getElementById('monsterSprite');
            sprite.classList.add('enhancing');

            setTimeout(() => {
                sprite.classList.remove('enhancing');

                if (success) {
                    monster.enhanceLevel += increase;
                    gameState.totalSuccess++;
                    if (isCritical) {
                        gameState.totalCriticals++;
                        sprite.classList.add('success');
                        showEnhanceResult(true, monster.enhanceLevel, true);
                        addBattleMsg(`크리티컬! 강화 성공! +${monster.enhanceLevel} (${increase}배)`, 'critical');
                    } else {
                        sprite.classList.add('success');
                        showEnhanceResult(true, monster.enhanceLevel, false);
                        addBattleMsg(`강화 성공! +${monster.enhanceLevel}`, 'heal');
                    }
                    createSparkles();

                    // 강화 보상: 새 몬스터 획득
                    if (monster.enhanceLevel % 3 === 0) {
                        grantRandomMonster(monster.enhanceLevel);
                    }
                    // 깨짐방지권 보상
                    if (monster.enhanceLevel % 5 === 0) {
                        gameState.shields++;
                        addBattleMsg(`깨짐방지권 +1 획득!`, 'reward');
                    }
                } else {
                    // 깨짐방지권 사용
                    if (gameState.shieldActive && gameState.shields > 0) {
                        gameState.shields--;
                        addBattleMsg(`깨짐방지권 사용! 레벨 유지`, 'reward');
                    } else {
                        gameState.totalFail++;
                        sprite.classList.add('fail');
                        showEnhanceResult(false, monster.enhanceLevel, false);
                        addBattleMsg(`강화 실패... (+${monster.enhanceLevel} 유지)`, 'damage');
                    }
                }

                setTimeout(() => { sprite.classList.remove('success', 'fail'); }, 600);
                updateUI();
                saveGame();
            }, 500);

            updateUI();
        }

        function forceEnhance() {
            const monster = gameState.collection[gameState.selectedMonster];
            if (!monster) return;

            const cost = getEnhanceCost(monster.enhanceLevel) * 3;
            if (gameState.gold < cost) { addBattleMsg('골드가 부족합니다!', 'damage'); return; }

            gameState.gold -= cost;
            gameState.totalEnhances++;

            const rate = getSuccessRate(monster.enhanceLevel) * 0.5;
            const critRate = getCriticalRate(monster.enhanceLevel) * 0.5;
            const roll = Math.random() * 100;
            const critRoll = Math.random() * 100;
            const isCritical = critRoll < critRate;
            const success = roll < rate;
            const increase = isCritical ? 2 : 1;

            const sprite = document.getElementById('monsterSprite');
            sprite.classList.add('enhancing');

            setTimeout(() => {
                sprite.classList.remove('enhancing');

                if (success) {
                    monster.enhanceLevel += increase;
                    gameState.totalSuccess++;
                    if (isCritical) {
                        gameState.totalCriticals++;
                        sprite.classList.add('success');
                        showEnhanceResult(true, monster.enhanceLevel, true);
                        addBattleMsg(`크리티컬! 강제 강화 성공! +${monster.enhanceLevel} (${increase}배)`, 'critical');
                    } else {
                        sprite.classList.add('success');
                        showEnhanceResult(true, monster.enhanceLevel, false);
                        addBattleMsg(`강제 강화 성공! +${monster.enhanceLevel}`, 'heal');
                    }
                    createSparkles();

                    if (monster.enhanceLevel % 3 === 0) grantRandomMonster(monster.enhanceLevel);
                    if (monster.enhanceLevel % 5 === 0) { gameState.shields++; addBattleMsg(`깨짐방지권 +1 획득!`, 'reward'); }
                } else {
                    // 깨짐방지권 사용
                    if (gameState.shieldActive && gameState.shields > 0) {
                        gameState.shields--;
                        addBattleMsg(`깨짐방지권 사용! 레벨 유지`, 'reward');
                    } else if (Math.random() < 0.3 && monster.enhanceLevel > 0) {
                        monster.enhanceLevel = Math.max(0, monster.enhanceLevel - 2);
                        addBattleMsg(`강제 강화 실패! 강화 레벨 하락...`, 'damage');
                    } else {
                        addBattleMsg(`강제 강화 실패...`, 'damage');
                    }
                    gameState.totalFail++;
                    sprite.classList.add('fail');
                    showEnhanceResult(false, monster.enhanceLevel, false);
                }

                setTimeout(() => { sprite.classList.remove('success', 'fail'); }, 600);
                updateUI();
                saveGame();
            }, 500);

            updateUI();
        }

        function grantRandomMonster(enhanceLevel) {
            const owned = Object.keys(gameState.collection).map(Number);
            const unowned = MONSTERS.filter(m => !owned.includes(m.id));

            if (unowned.length === 0) {
                const goldReward = enhanceLevel * 1000;
                gameState.gold += goldReward;
                addBattleMsg(`모든 몬스터 보유! 골드 +${goldReward}`, 'gold');
                return;
            }

            let tier;
            if (enhanceLevel >= 15) tier = ['rare', 'epic', 'legendary', 'mythic', 'divine'];
            else if (enhanceLevel >= 10) tier = ['uncommon', 'rare', 'epic', 'legendary'];
            else if (enhanceLevel >= 6) tier = ['common', 'uncommon', 'rare', 'epic'];
            else tier = ['common', 'uncommon', 'rare'];

            const candidates = unowned.filter(m => tier.includes(m.tier));
            const pool = candidates.length > 0 ? candidates : unowned;
            const monster = pool[Math.floor(Math.random() * pool.length)];

            gameState.collection[monster.id] = { level: 1, enhanceLevel: 0 };
            showRewardPopup(monster);
            addBattleMsg(`새 몬스터 획득: ${monster.name}!`, 'reward');
        }

        function showRewardPopup(monster) {
            document.getElementById('rewardSprite').textContent = monster.sprite;
            document.getElementById('rewardName').textContent = monster.name;
            const tierEl = document.getElementById('rewardTier');
            tierEl.textContent = TIER_NAMES[monster.tier];
            tierEl.style.color = TIER_COLORS[monster.tier];
            document.getElementById('rewardPopup').classList.add('show');
        }

        function closeRewardPopup() {
            document.getElementById('rewardPopup').classList.remove('show');
        }

        function showEnhanceResult(success, level, isCritical) {
            const result = document.createElement('div');
            result.className = `enhance-result ${success ? (isCritical ? 'critical' : 'success') : 'fail'}`;
            result.textContent = success ? (isCritical ? `크리티컬! +${level}` : `성공! +${level}`) : '실패...';
            document.body.appendChild(result);
            setTimeout(() => result.remove(), 1500);
        }

        function createSparkles() {
            const display = document.querySelector('.monster-display');
            for (let i = 0; i < 20; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.innerHTML = ['✨', '⭐', '💫', '🌟'][Math.floor(Math.random() * 4)];
                sparkle.style.left = '50%';
                sparkle.style.top = '50%';
                sparkle.style.fontSize = '1.5rem';
                sparkle.style.setProperty('--tx', `${(Math.random() - 0.5) * 300}px`);
                sparkle.style.setProperty('--ty', `${(Math.random() - 0.5) * 300}px`);
                display.appendChild(sparkle);
                setTimeout(() => sparkle.remove(), 1000);
            }
        }

        // ==================== GACHA SYSTEM ====================
        function pullGacha() {
            if (gameState.gold < 500) { addBattleMsg('골드가 부족합니다! (500 필요)', 'damage'); return; }

            gameState.gold -= 500;

            const roll = Math.random() * 100;
            let tier;
            if (roll < 40) tier = 'common';
            else if (roll < 65) tier = 'uncommon';
            else if (roll < 82) tier = 'rare';
            else if (roll < 93) tier = 'epic';
            else if (roll < 98) tier = 'legendary';
            else if (roll < 99.5) tier = 'mythic';
            else tier = 'divine';

            const tierMonsters = MONSTERS.filter(m => m.tier === tier);
            const monster = tierMonsters[Math.floor(Math.random() * tierMonsters.length)];

            if (!gameState.collection[monster.id]) {
                gameState.collection[monster.id] = { level: 1, enhanceLevel: 0 };
            }

            const result = document.getElementById('gachaResult');
            document.getElementById('gachaMonsterSprite').textContent = monster.sprite;
            document.getElementById('gachaMonsterName').textContent = monster.name;
            const tierEl = document.getElementById('gachaMonsterTier');
            tierEl.textContent = TIER_NAMES[monster.tier];
            tierEl.style.color = TIER_COLORS[monster.tier];
            result.classList.add('show');

            addBattleMsg(`[${TIER_NAMES[monster.tier]}] ${monster.name} 획득!`, 'gold');
            gameState.selectedMonster = monster.id;

            updateUI();
            saveGame();
        }

        // ==================== BATTLE SYSTEM ====================
        function toggleAutoBattle() {
            gameState.autoBattle = !gameState.autoBattle;
            document.getElementById('autoBattleToggle').classList.toggle('active', gameState.autoBattle);
            document.getElementById('autoBattleStatus').textContent = gameState.autoBattle ? 'ON' : 'OFF';
            document.getElementById('autoBattleStatus').style.color = gameState.autoBattle ? '#27ae60' : '#666';

            if (gameState.autoBattle) startBattle();
            else stopBattle();
        }

        function startBattle() {
            if (gameState.battleTimer) return;
            spawnEnemy();
            gameState.battleTimer = setInterval(battleTick, 1000);
        }

        function stopBattle() {
            if (gameState.battleTimer) { clearInterval(gameState.battleTimer); gameState.battleTimer = null; }
        }

        function spawnEnemy() {
            const enemyTier = Math.min(Math.floor(Math.random() * 5) + 1, 6);
            const tiers = ['common', 'uncommon', 'rare', 'epic', 'legendary', 'mythic'];
            const tierMonsters = MONSTERS.filter(m => m.tier === tiers[enemyTier - 1]);
            const enemy = tierMonsters[Math.floor(Math.random() * tierMonsters.length)];

            const scaleFactor = 0.8 + Math.random() * 0.4;
            gameState.currentEnemy = enemy;
            gameState.enemyMaxHp = Math.floor(enemy.baseHp * scaleFactor);
            gameState.enemyHp = gameState.enemyMaxHp;

            document.getElementById('enemyBattleSprite').textContent = enemy.sprite;
            document.getElementById('enemyBattleName').textContent = enemy.name;
            updateBattleUI();
        }

        function battleTick() {
            if (!gameState.autoBattle || !gameState.currentEnemy) return;

            const monster = gameState.collection[gameState.selectedMonster];
            const playerStats = getMonsterStats(gameState.selectedMonster, monster?.enhanceLevel || 0);
            const enemy = gameState.currentEnemy;

            const playerDmg = Math.floor(playerStats.atk * (0.8 + Math.random() * 0.4));
            gameState.enemyHp -= playerDmg;

            const playerSprite = document.getElementById('playerBattleSprite');
            const enemySprite = document.getElementById('enemyBattleSprite');
            playerSprite.classList.add('attacking');
            enemySprite.classList.add('hit');
            setTimeout(() => { playerSprite.classList.remove('attacking'); enemySprite.classList.remove('hit'); }, 300);

            addBattleMsg(`${playerDmg} 피해!`, 'damage');

            if (gameState.enemyHp <= 0) {
                const goldReward = Math.floor(enemy.baseHp * (2 + Math.random() * 2));
                gameState.gold += goldReward;
                addBattleMsg(`승리! +${goldReward} 골드`, 'gold');

                // 깨짐방지권 드롭
                if (Math.random() < 0.08) {
                    gameState.shields++;
                    addBattleMsg(`깨짐방지권 +1 획득!`, 'reward');
                }

                spawnEnemy();
                updateUI();
                return;
            }

            const enemyDmg = Math.floor(enemy.baseAtk * (0.8 + Math.random() * 0.4) * 0.5);
            addBattleMsg(`적의 반격! ${enemyDmg} 피해`, 'damage');

            updateBattleUI();
        }

        function updateBattleUI() {
            const monster = gameState.collection[gameState.selectedMonster];
            document.getElementById('playerBattleSprite').textContent = MONSTERS.find(m => m.id === gameState.selectedMonster).sprite;
            document.getElementById('playerBattleName').textContent = `${MONSTERS.find(m => m.id === gameState.selectedMonster).name} +${monster?.enhanceLevel || 0}`;
            document.getElementById('playerHpBar').style.width = '100%';
            if (gameState.currentEnemy) {
                document.getElementById('enemyHpBar').style.width = `${(gameState.enemyHp / gameState.enemyMaxHp) * 100}%`;
            }
        }

        function addBattleMsg(text, type) {
            const log = document.getElementById('battleLog');
            const div = document.createElement('div');
            div.className = `battle-msg ${type}`;
            div.textContent = text;
            log.appendChild(div);
            log.scrollTop = log.scrollHeight;
            while (log.children.length > 30) log.removeChild(log.firstChild);
        }

        // ==================== UI UPDATE ====================
        function updateUI() {
            const monster = gameState.collection[gameState.selectedMonster];
            const base = MONSTERS.find(m => m.id === gameState.selectedMonster);
            const enhanceLevel = monster?.enhanceLevel || 0;
            const stats = getMonsterStats(gameState.selectedMonster, enhanceLevel);

            document.getElementById('goldDisplay').textContent = formatNumber(gameState.gold);
            document.getElementById('shieldCount').textContent = gameState.shields;
            document.getElementById('shieldInventory').textContent = gameState.shields;
            document.getElementById('totalEnhanceDisplay').textContent = gameState.totalEnhances;

            document.getElementById('monsterSprite').textContent = base.sprite;
            document.getElementById('enhanceLevel').textContent = enhanceLevel;
            document.getElementById('monsterName').textContent = base.name;

            const tierEl = document.getElementById('monsterTier');
            tierEl.textContent = TIER_NAMES[base.tier];
            tierEl.className = `monster-tier tier-${base.tier}`;
            tierEl.style.color = TIER_COLORS[base.tier];

            const rate = getSuccessRate(enhanceLevel);
            document.getElementById('successRateText').textContent = `${rate}%`;
            document.getElementById('rateText').textContent = `${rate}%`;
            const rateBar = document.getElementById('successRateBar');
            rateBar.style.width = `${rate}%`;
            if (rate >= 70) rateBar.style.background = 'linear-gradient(90deg, #27ae60, #2ecc71)';
            else if (rate >= 40) rateBar.style.background = 'linear-gradient(90deg, #f39c12, #e67e22)';
            else rateBar.style.background = 'linear-gradient(90deg, #e74c3c, #c0392b)';

            const critRate = getCriticalRate(enhanceLevel);
            document.getElementById('criticalRateText').textContent = `${critRate.toFixed(1)}%`;

            document.getElementById('enhanceCost').textContent = formatNumber(getEnhanceCost(enhanceLevel));
            document.getElementById('atkValue').textContent = formatNumber(stats.atk);
            document.getElementById('hpValue').textContent = formatNumber(stats.hp);

            const owned = Object.keys(gameState.collection).length;
            document.getElementById('collectionCount').textContent = `${owned}/300`;
            document.getElementById('collectionText').textContent = `${owned}/300`;

            updateMonsterGrid();
            updateBattleUI();
        }

        function updateMonsterGrid(filter = 'all') {
            const grid = document.getElementById('monsterGrid');
            grid.innerHTML = '';
            const monsters = MONSTERS.filter(m => filter === 'owned' ? gameState.collection[m.id] : true);

            for (const monster of monsters) {
                const owned = gameState.collection[monster.id];
                const card = document.createElement('div');
                card.className = `monster-card ${owned ? '' : 'locked'} ${gameState.selectedMonster === monster.id ? 'selected' : ''}`;
                const cardLevel = owned ? `<span class="card-level">+${owned.enhanceLevel}</span>` : '';
                const tierColor = TIER_COLORS[monster.tier];
                card.innerHTML = `${cardLevel}<span class="card-sprite">${owned ? monster.sprite : '❓'}</span><div class="card-tier" style="background: ${tierColor};"></div>`;
                card.onclick = () => { if (owned) { gameState.selectedMonster = monster.id; updateUI(); } };
                grid.appendChild(card);
            }
        }

        function switchTab(tab, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            updateMonsterGrid(tab);
        }

        function formatNumber(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toString();
        }

        // ==================== SAVE/LOAD ====================
        function saveGame() {
            localStorage.setItem('monsterEnhanceSave', JSON.stringify(gameState));
            const indicator = document.getElementById('saveIndicator');
            indicator.classList.add('show');
            setTimeout(() => indicator.classList.remove('show'), 1500);
        }

        function loadGame() {
            const save = localStorage.getItem('monsterEnhanceSave');
            if (save) {
                try { gameState = { ...gameState, ...JSON.parse(save) }; } catch (e) { console.error('Save load failed:', e); }
            }
            if (Object.keys(gameState.collection).length === 0) {
                gameState.collection[1] = { level: 1, enhanceLevel: 0 };
                gameState.collection[2] = { level: 1, enhanceLevel: 0 };
                gameState.collection[3] = { level: 1, enhanceLevel: 0 };
            }
        }

        // ==================== INIT ====================
        loadGame();
        updateUI();
        setInterval(saveGame, 30000);
    </script>
</body>
</html>
